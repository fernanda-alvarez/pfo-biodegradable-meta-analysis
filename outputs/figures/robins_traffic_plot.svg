"/><text x="646.7" y="484.5" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#fff">-</text><text x="664.7" y="485" font-size="11" fill="#000">Moderate</text><circle cx="646.7" cy="502" r="8" fill="#02C100" stroke="#000" stroke-width="0.8"/><text x="646.7" y="505.5" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#fff">+</text><text x="664.7" y="506" font-size="11" fill="#000">Low</text><text x="274.7" y="424" font-size="11" fill="#000">Domains (ROBINS-I v2, cribsheet 20 November 2025):</text><text x="274.7" y="439" font-size="11" fill="#000">D1: Bias due to confounding (Variant A: effect of</text><text x="274.7" y="454" font-size="11" fill="#000">assignment; Variant B: effect of adhering to</text><text x="274.7" y="469" font-size="11" fill="#000">intervention).</text><text x="274.7" y="484" font-size="11" fill="#000">D2: Bias in classification of interventions.</text><text x="274.7" y="499" font-size="11" fill="#000">D3: Bias in selection of participants into the study (or</text><text x="274.7" y="514" font-size="11" fill="#000">into the analysis).</text><text x="274.7" y="529" font-size="11" fill="#000">D4: Bias due to missing data.</text><text x="274.7" y="544" font-size="11" fill="#000">D5: Bias in measurement of the outcome.</text><text x="274.7" y="559" font-size="11" fill="#000">D6: Bias in selection of the reported result.</text><text x="274.7" y="574" font-size="11" fill="#000">Overall algorithm (cribsheet p.49): worst domain, with</text><text x="274.7" y="589" font-size="11" fill="#000">additive escalation — several Moderate (&gt;=2) to Serious;</text><text x="274.7" y="604" font-size="11" fill="#000">several Serious (&gt;=2) to Critical.</text><text x="274.7" y="619" font-size="11" fill="#000">Overall Low: Low risk of bias except for concerns about</text><text x="274.7" y="634" font-size="11" fill="#000">uncontrolled confounding — reached when D1 is Low and all</text><text x="274.7" y="649" font-size="11" fill="#000">other domains are Low.</text></svg>